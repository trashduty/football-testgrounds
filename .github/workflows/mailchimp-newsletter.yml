name: Notify Newsletter Subscribers

on:
  push:
    branches:
      - main
    paths:
      - 'outputs/matchup_articles/**'
  workflow_dispatch: 
jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Create and Send Mailchimp Campaign
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_AUDIENCE_ID: ${{ secrets.MAILCHIMP_AUDIENCE_ID }}
          MAILCHIMP_SERVER: ${{ secrets.MAILCHIMP_SERVER }}
        run: |
          # Find the first .md article file (excluding weekly_matchup_articles.md and test files)
          ARTICLE_FILE=$(find outputs/matchup_articles -name "*.md" -type f ! -name "weekly_matchup_articles.md" ! -name "test" | head -1)
          
          if [ -z "$ARTICLE_FILE" ]; then
            echo "No article file found"
            exit 1
          fi
          
          echo "Found article: $ARTICLE_FILE"
          
          # Read the article content
          ARTICLE_CONTENT=$(cat "$ARTICLE_FILE")
          
          # Convert markdown to basic HTML (simple approach)
          # For more complex markdown, consider using a tool like pandoc
          ARTICLE_HTML=$(echo "$ARTICLE_CONTENT" | sed 's/^# /\n<h1>/g; s/^## /\n<h2>/g; s/^### /\n<h3>/g; s/$/\n/g')
          
          # Get commit info
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          COMMIT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          
          # Extract article title from filename
          ARTICLE_TITLE=$(basename "$ARTICLE_FILE" .md | tr '_' ' ' | sed 's/\b\(.\)/\u\1/g')
          
          # Step 1: Create a campaign
          CAMPAIGN_RESPONSE=$(curl -s -X POST "https://${MAILCHIMP_SERVER}.api.mailchimp.com/3.0/campaigns" \
            -u "anystring:${MAILCHIMP_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "regular",
              "recipients": {"list_id": "'${MAILCHIMP_AUDIENCE_ID}'"},
              "settings": {
                "subject_line": "New NFL Article: '"${ARTICLE_TITLE}"'",
                "title": "NFL Newsletter - '"${ARTICLE_TITLE}"'",
                "from_name": "BTB Analytics",
                "reply_to": "bullytheboard@gmail.com"
              }
            }')
          
          CAMPAIGN_ID=$(echo $CAMPAIGN_RESPONSE | jq -r '.id')
          echo "Created campaign: $CAMPAIGN_ID"
          
          # Step 2: Set campaign content with the article
          curl -s -X PUT "https://${MAILCHIMP_SERVER}.api.mailchimp.com/3.0/campaigns/${CAMPAIGN_ID}/content" \
            -u "anystring:${MAILCHIMP_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "html": "<h2>'"${ARTICLE_TITLE}"'</h2><div style=\"line-height: 1.6; font-family: Arial, sans-serif;\">'"$(echo "$ARTICLE_CONTENT" | jq -Rs .)"'</div><hr/><p><a href=\"'"${COMMIT_URL}"'\">View all articles in repository</a></p>"
            }'
          
          # Step 3: Send the campaign
          SEND_RESPONSE=$(curl -s -X POST "https://${MAILCHIMP_SERVER}.api.mailchimp.com/3.0/campaigns/${CAMPAIGN_ID}/actions/send" \
            -u "anystring:${MAILCHIMP_API_KEY}" \
            -H "Content-Type: application/json")
          
          echo "Campaign sent. Response: $SEND_RESPONSE"
