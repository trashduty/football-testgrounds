name: Notify Newsletter Subscribers

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and send Mailchimp campaign with full article body
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_AUDIENCE_ID: ${{ secrets.MAILCHIMP_AUDIENCE_ID }}
          MAILCHIMP_SERVER: ${{ secrets.MAILCHIMP_SERVER }}
        run: |
          set -euo pipefail

          # 1) Pick the exact article you want for now
          ARTICLE_FILE="outputs/matchup_articles/week_1/atl_at_pit.md"
          test -f "$ARTICLE_FILE"

          # 2) Build safe HTML from markdown (keeps full text visible)
          python3 - <<'PY'
          from pathlib import Path
          import html
          md = Path("outputs/matchup_articles/week_1/atl_at_pit.md").read_text(encoding="utf-8")
          # Simple reliable rendering: show entire article in pre-wrap block
          body = f"""<h1>ATL at PIT</h1>
          <div style="font-family:Arial,sans-serif;line-height:1.6;white-space:pre-wrap;">{html.escape(md)}</div>"""
          Path("mailchimp_body.html").write_text(body, encoding="utf-8")
          PY

          # 3) Create campaign
          CREATE_JSON=$(jq -n \
            --arg list "$MAILCHIMP_AUDIENCE_ID" \
            '{
              type:"regular",
              recipients:{list_id:$list},
              settings:{
                subject_line:"New NFL Article: ATL at PIT",
                title:"NFL Newsletter - ATL at PIT",
                from_name:"BTB Analytics",
                reply_to:"bullytheboard@gmail.com"
              }
            }')

          CAMPAIGN_RESPONSE=$(curl -sS -X POST "https://${MAILCHIMP_SERVER}.api.mailchimp.com/3.0/campaigns" \
            -u "anystring:${MAILCHIMP_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$CREATE_JSON")

          CAMPAIGN_ID=$(echo "$CAMPAIGN_RESPONSE" | jq -r '.id')
          if [ -z "${CAMPAIGN_ID}" ] || [ "${CAMPAIGN_ID}" = "null" ]; then
            echo "Campaign creation failed:"
            echo "$CAMPAIGN_RESPONSE"
            exit 1
          fi

          # 4) Set campaign content (THIS is the key fix)
          CONTENT_JSON=$(jq -n --rawfile html mailchimp_body.html '{html:$html}')

          CONTENT_RESPONSE=$(curl -sS -X PUT "https://${MAILCHIMP_SERVER}.api.mailchimp.com/3.0/campaigns/${CAMPAIGN_ID}/content" \
            -u "anystring:${MAILCHIMP_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$CONTENT_JSON")

          # sanity check
          echo "$CONTENT_RESPONSE" | jq .

          # 5) Send campaign
          SEND_RESPONSE=$(curl -sS -X POST "https://${MAILCHIMP_SERVER}.api.mailchimp.com/3.0/campaigns/${CAMPAIGN_ID}/actions/send" \
            -u "anystring:${MAILCHIMP_API_KEY}" \
            -H "Content-Type: application/json")

          echo "$SEND_RESPONSE" | jq .
