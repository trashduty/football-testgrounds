name: Draft Drive Video Captions

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum new videos to draft (1-25)'
        default: '5'
        required: true
      file_id:
        description: 'Optional: regenerate one unposted video after editing its commentary start'
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: drive-video-queue
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install google-api-python-client google-auth openai
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate drafts (never publishes)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: '1nuN7Yhr3wZOYAmND7NfaEVPzcx6IGQB5'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAPTION_MODEL: ${{ vars.CAPTION_MODEL || 'gpt-4.1-mini' }}
          DRAFT_LIMIT: ${{ inputs.limit }}
          DRAFT_FILE_ID: ${{ inputs.file_id }}
        run: |
          args=(--limit "$DRAFT_LIMIT")
          if [[ -n "$DRAFT_FILE_ID" ]]; then args+=(--file-id "$DRAFT_FILE_ID"); fi
          python scripts/draft_drive_video_captions.py "${args[@]}"
      - name: Save completed drafts for review
        if: always()
        run: |
          if [[ ! -d outputs/drive_videos ]]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/drive_videos
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Save Drive video caption drafts for review'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Downloadable review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-video-caption-drafts
          path: outputs/drive_videos/
          if-no-files-found: ignore
