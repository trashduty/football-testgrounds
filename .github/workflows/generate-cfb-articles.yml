name: Generate CFB Matchup Articles

on:
  # Run every day at 6:00 AM Arizona time
  # GitHub Actions cron uses UTC.
  # Arizona = UTC-7, so 06:00 Arizona = 13:00 UTC.
  schedule:
    - cron: '0 13 * * *'

  # Keep manual runs available
  workflow_dispatch:
    inputs:
      week:
        description: 'Week number'
        required: false
        type: number

      season:
        description: 'Season year'
        required: false
        type: number

      teams:
        description: 'Specific teams to generate articles for (comma-separated, optional)'
        required: false
        type: string

jobs:
  generate-articles:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ------------------------------------------------------------
      # Checkout trash-schedule repo for spreads/crosswalk source data
      # ------------------------------------------------------------
      - name: Checkout trash-schedule
        uses: actions/checkout@v4
        with:
          repository: trashduty/trash-schedule
          path: trash-schedule
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Checkout football-testgrounds repo
      # ------------------------------------------------------------
      - name: Checkout football-testgrounds
        uses: actions/checkout@v4
        with:
          path: football-testgrounds

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        working-directory: football-testgrounds
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests cfbd openai pypdf markdown pillow

      # ------------------------------------------------------------
      # Optional debug: confirm expected files exist
      # ------------------------------------------------------------
      - name: Verify article files and guide directory
        working-directory: football-testgrounds
        run: |
          echo "Checking scripts..."
          ls -la scripts/

          echo ""
          echo "Checking guide directory..."
          if [ -d "game_guides" ]; then
            find game_guides -maxdepth 3 -type f -print
          else
            echo "game_guides directory does not exist"
          fi

      # ------------------------------------------------------------
      # Generate articles
      # ------------------------------------------------------------
      - name: Generate articles
        working-directory: football-testgrounds
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          ARGS=()

          if [ -n "${{ inputs.week }}" ]; then
            ARGS+=(--week "${{ inputs.week }}")
          fi

          if [ -n "${{ inputs.season }}" ]; then
            ARGS+=(--season "${{ inputs.season }}")
          fi

          if [ -n "${{ inputs.teams }}" ]; then
            IFS=',' read -ra TEAM_ARRAY <<< "${{ inputs.teams }}"

            ARGS+=(--teams)

            for team in "${TEAM_ARRAY[@]}"; do
              team="$(echo "$team" | xargs)"
              ARGS+=("$team")
            done
          fi

          python scripts/weekly_matchup_articles_cfb.py \
            --output-dir outputs/cfb_matchup_articles \
            --guide-dir game_guides \
            --trash-schedule-dir ../trash-schedule \
            "${ARGS[@]}"

      # ------------------------------------------------------------
      # Show generated output for easier debugging
      # ------------------------------------------------------------
      - name: Show generated files
        working-directory: football-testgrounds
        run: |
          echo "Generated article files:"
          find outputs/cfb_matchup_articles -maxdepth 3 -type f -print || true

      # ------------------------------------------------------------
      # Commit generated articles
      # ------------------------------------------------------------
      - name: Commit and push outputs
        working-directory: football-testgrounds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status -s outputs/) ]]; then
            git add outputs/
            git commit -m "Generate CFB matchup articles"
            git push
          else
            echo "No output changes to commit"
          fi
