name: Post CFB graphic to X

on:
  schedule:
    - cron: '7 9-16 * * 1-5'
      timezone: America/New_York
    - cron: '7,37 9-18 * * 6'
      timezone: America/New_York
    - cron: '7 19 * * 6'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish now (false previews the current Eastern slot)'
        required: true
        type: boolean
        default: false
      test_now:
        description: 'Post one no-bet graphic immediately, even outside schedule (requires publish)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-cfb-to-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout current CFB kickoff times
        uses: actions/checkout@v4
        with:
          repository: trashduty/trash-schedule
          path: trash-schedule
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify kickoff feed is available
        run: test -s trash-schedule/CFB_Odds/Data/spreads_odds.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install posting dependencies
        run: python -m pip install requests requests-oauthlib
      - name: Select and optionally publish
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [[ '${{ github.event_name }}' == 'schedule' || '${{ inputs.publish }}' == 'true' ]]; then
            if [[ '${{ inputs.test_now }}' == 'true' ]]; then
              python scripts/post_cfb_to_x.py --publish --test-now
            else
              python scripts/post_cfb_to_x.py --publish
            fi
          else
            python scripts/post_cfb_to_x.py
          fi
      - name: Persist posting record
        if: success()
        run: |
          if [[ -n "$(git status --porcelain -- outputs/cfb_x_posted.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add outputs/cfb_x_posted.json
            git commit -m 'Record CFB X post'
            git push
          fi
