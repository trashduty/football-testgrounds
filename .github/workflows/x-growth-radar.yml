name: BTB X Growth Radar

on:

  # Allows you to run the workflow manually
  # from the GitHub Actions tab.
  workflow_dispatch:

  schedule:

    # -------------------------------------------------
    # NORMAL DAYTIME
    # 6 AM - 2:59 PM Phoenix
    # Every 20 minutes
    # -------------------------------------------------

    - cron: "7,27,47 6-14 * * *"
      timezone: "America/Phoenix"

    # -------------------------------------------------
    # PEAK EVENING
    # 3 PM - 9:59 PM Phoenix
    # Every 10 minutes
    # -------------------------------------------------

    - cron: "3,13,23,33,43,53 15-21 * * *"
      timezone: "America/Phoenix"

    # -------------------------------------------------
    # OVERNIGHT / LOW ACTIVITY
    # 10 PM - 5:59 AM Phoenix
    # Once per hour
    # -------------------------------------------------

    - cron: "17 22-23,0-5 * * *"
      timezone: "America/Phoenix"


permissions:
  contents: read


concurrency:

  group: btb-x-growth-radar

  # We do not want two Growth Radar jobs
  # running at the same time.
  cancel-in-progress: false


jobs:

  growth-radar:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ------------------------------------------------
      # CHECK OUT REPOSITORY
      # ------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # ------------------------------------------------
      # PYTHON
      # ------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"


      # ------------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------
      # RESTORE PREVIOUS ALERT STATE
      #
      # This lets us remember which X posts
      # have already produced Discord alerts.
      # ------------------------------------------------

      - name: Restore Growth Radar state
        id: restore-growth-state
        uses: actions/cache/restore@v4
        with:
          path: x_growth/state
          key: x-growth-state-${{ github.run_id }}
          restore-keys: |
            x-growth-state-


      # ------------------------------------------------
      # ENSURE STATE DIRECTORY EXISTS
      # ------------------------------------------------

      - name: Create state directory
        run: |
          mkdir -p x_growth/state


      # ------------------------------------------------
      # RUN GROWTH RADAR
      # ------------------------------------------------

      - name: Run X Growth Radar
        env:

          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          python -m x_growth.main


      # ------------------------------------------------
      # SAVE UPDATED STATE
      #
      # Unique run ID means a new state snapshot is
      # saved after every run.
      # ------------------------------------------------

      - name: Save Growth Radar state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: x_growth/state
          key: x-growth-state-${{ github.run_id }}
