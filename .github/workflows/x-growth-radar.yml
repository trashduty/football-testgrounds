name: BTB X Growth Radar

on:

  workflow_dispatch:

  schedule:

    - cron: "3,13,23,33,43,53 6-22 * * *"
      timezone: "America/Phoenix"

    - cron: "17 23,0-5 * * *"
      timezone: "America/Phoenix"


permissions:
  contents: read


concurrency:

  group: btb-x-growth-radar

  cancel-in-progress: false


jobs:

  growth-radar:

    runs-on: ubuntu-latest

    timeout-minutes: 15


    steps:

      # ======================================================
      # MAIN REPOSITORY
      # ======================================================

      - name: Checkout football-testgrounds
        uses: actions/checkout@v7


      # ======================================================
      # LIVE BTB MODEL / MARKET DATA
      #
      # This is checked out fresh every radar run.
      # ======================================================

      - name: Checkout trash-schedule
        uses: actions/checkout@v7

        with:

          repository: trashduty/trash-schedule

          path: external/trash-schedule


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v6

        with:

          python-version: "3.13"

          cache: "pip"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # RESTORE RADAR STATE
      # ======================================================

      - name: Restore Growth Radar state

        id: restore-growth-state

        uses: actions/cache/restore@v4

        with:

          path: x_growth/state

          key: x-growth-state-${{ github.run_id }}

          restore-keys: |
            x-growth-state-


      - name: Create state directory

        run: |

          mkdir -p x_growth/state


      # ======================================================
      # RUN PHASE 2
      # ======================================================

      - name: Run X Growth Radar

        env:

          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |

          python -m x_growth.main


      # ======================================================
      # SAVE STATE
      # ======================================================

      - name: Save Growth Radar state

        if: always()

        uses: actions/cache/save@v4

        with:

          path: x_growth/state

          key: x-growth-state-${{ github.run_id }}
