x_api:
  max_results_per_query: 30
  request_timeout_seconds: 30

  # Keep generated queries below X's standard
  # Recent Search query-length ceiling.
  max_query_characters: 475

data:

  cfb_crosswalk:
    path: "config/cfb_team_crosswalk.csv"

openai:
  model: gpt-5-mini
  timeout_seconds: 45

  generate_alternative: true

  # If the generator decides BTB has nothing genuinely
  # useful to add, don't send the Discord alert.
  require_useful_reply: true

reply_generation:
  max_context_rows_per_source: 3
  max_note_characters: 4500

  preferred_max_characters: 500
  alternative_max_characters: 500

alerts:

  # Different opportunities deserve different thresholds.
  thresholds:
    TEAM_VIDEO: 80
    TEAM_HYPE: 78
    STAR_PLAYER_NEWS: 80
    NFL_CAMP: 82
    INJURY: 70
    DEPTH_CHART: 82
    FUTURES: 70
    RANKINGS: 75
    POWER_RATINGS: 75
    MATCHUP: 75
    GENERAL: 80

  high_priority_threshold: 86

  # Maximum Discord messages from one radar run.
  max_alerts_per_run: 4

  # Avoid having four alerts about the same team
  # dominate a single run.
  max_alerts_per_team_per_run: 2

state:
  keep_alerted_days: 7

logging:
  max_log_rows: 10000

scoring:

  # Maximum contribution of each component.
  freshness_max: 20
  reach_max: 20
  velocity_max: 25
  relevance_max: 15
  team_priority_max: 10
  source_priority_max: 10
