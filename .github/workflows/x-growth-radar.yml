name: BTB X Growth Radar

on:

  workflow_dispatch:

  schedule:

    # -------------------------------------------------
    # 6 AM through 10 PM Phoenix
    #
    # Run controller every 10 minutes.
    # Individual search buckets have their own cadence.
    # -------------------------------------------------

    - cron: "3,13,23,33,43,53 6-21 * * *"
      timezone: "America/Phoenix"

    # 10 PM
    - cron: "3,13,23,33,43,53 22 * * *"
      timezone: "America/Phoenix"

    # -------------------------------------------------
    # Overnight
    # One controller run per hour.
    # -------------------------------------------------

    - cron: "17 23,0-5 * * *"
      timezone: "America/Phoenix"


permissions:
  contents: read


concurrency:

  group: btb-x-growth-radar

  cancel-in-progress: false


jobs:

  growth-radar:

    runs-on: ubuntu-latest

    timeout-minutes: 10


    steps:

      # ------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # ------------------------------------------------
      # PYTHON
      # ------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6

        with:

          python-version: "3.13"

          cache: "pip"


      # ------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ------------------------------------------------
      # RESTORE STATE
      #
      # Contains:
      #
      # alerted_ids.json
      # search_runs.json
      # opportunities.csv
      #
      # ------------------------------------------------

      - name: Restore Growth Radar state

        id: restore-growth-state

        uses: actions/cache/restore@v4

        with:

          path: x_growth/state

          key: x-growth-state-${{ github.run_id }}

          restore-keys: |
            x-growth-state-


      # ------------------------------------------------
      # STATE DIRECTORY
      # ------------------------------------------------

      - name: Create state directory

        run: |

          mkdir -p x_growth/state


      # ------------------------------------------------
      # RUN RADAR
      # ------------------------------------------------

      - name: Run X Growth Radar

        env:

          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |

          python -m x_growth.main


      # ------------------------------------------------
      # SAVE STATE
      # ------------------------------------------------

      - name: Save Growth Radar state

        if: always()

        uses: actions/cache/save@v4

        with:

          path: x_growth/state

          key: x-growth-state-${{ github.run_id }}
