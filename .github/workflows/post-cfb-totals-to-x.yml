name: Post CFB totals graphic to X

on:

  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish now (false previews the current Eastern slot)'
        type: boolean
        required: true
        default: false
      test_now:
        description: 'Post one no-bet total immediately, even outside schedule (requires publish)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: cfb-x-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout current totals odds
        uses: actions/checkout@v4
        with:
          repository: trashduty/trash-schedule
          path: trash-schedule
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify totals feed
        run: test -s trash-schedule/CFB_Odds/Data/totals_odds.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests requests-oauthlib pillow
      - name: Select and optionally publish
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [[ '${{ github.event_name }}' == 'schedule' || '${{ inputs.publish }}' == 'true' ]]; then
            if [[ '${{ inputs.test_now }}' == 'true' ]]; then
              python scripts/post_cfb_totals_to_x.py --publish --test-now
            else
              python scripts/post_cfb_totals_to_x.py --publish
            fi
          else
            python scripts/post_cfb_totals_to_x.py
          fi
      - name: Persist totals posting record
        if: success()
        run: |
          if [[ -n "$(git status --porcelain -- outputs/cfb_x_totals_posted.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add outputs/cfb_x_totals_posted.json
            git commit -m 'Record CFB totals X post'
            git pull --rebase origin main
            git push
          fi
